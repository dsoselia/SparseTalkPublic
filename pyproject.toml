[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsetalk"
version = "0.1.0"
description = "Gaussian feature selection and SplatTalk workflow tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sparsetalk = "sparsetalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
